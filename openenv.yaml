name: email-triage-env
description: >
  Context-aware email triage environment with classification, prioritization,
  and response generation. An AI agent must correctly categorize customer emails,
  detect spam, and identify urgent issues requiring immediate response.
version: "0.1.0"
entry_point: server.app:app

tasks:
  - customer_support_triage
  - spam_classification
  - urgency_detection

action_space:
  type: object
  properties:
    category:
      type: string
    priority:
      type: string
    response:
      type: string

observation_space:
  type: object
  properties:
    email_id:
      type: string
    subject:
      type: string
    body:
      type: string

reward_range: [0.0, 1.0]
max_steps: 1
