name: email-triage-env
description: Context-aware email triage environment with classification, prioritization, and response generation

entry_point: server.app:app

tasks:
  - name: easy
    description: Classify email into category
    max_steps: 1
    grader:
      type: llm
      criteria: "The agent successfully and accurately categorized the email into a valid category."

  - name: medium
    description: Classify email and assign priority
    max_steps: 1
    grader:
      type: llm
      criteria: "The agent accurately categorized the email and assigned the correct priority level (low, medium, or high)."

  - name: hard
    description: Full triage including response generation
    max_steps: 1
    grader:
      type: llm
      criteria: "The agent categorized, prioritized, and wrote a highly professional and relevant response to the email."

observation_space:
  type: object
  properties:
    email_id:
      type: string
    subject:
      type: string
    body:
      type: string
    history:
      type: string

action_space:
  type: object
  properties:
    category:
      type: string
    priority:
      type: string
    response:
      type: string

reward:
  type: float
  min: 0.0
  max: 1.0