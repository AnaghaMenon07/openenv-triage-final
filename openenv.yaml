spec_version: 1
name: email-triage-env
version: "0.1.0"
description: "Context-aware email triage environment with classification, prioritization, and response generation"
entry_point: "server.app:app"

server:
  dockerfile: Dockerfile
  port: 7860
  local_image_name: email-triage-env-img

tasks:
  - id: customer_support_triage
    name: customer_support_triage
    description: "Classify and triage customer support emails"
    grader: grade/customer_support_triage.py
    difficulty: easy
    difficulty_score: 1
    max_steps: 1
    expected_score: 1.0
    criteria: "The agent should correctly identify the user's intent (e.g., refund, billing inquiry, technical support) and categorize it accordingly."

  - id: spam_classification
    name: spam_classification
    description: "Classify email as spam or not spam"
    grader: grade/spam_classification.py
    difficulty: medium
    difficulty_score: 2
    max_steps: 1
    expected_score: 1.0
    criteria: "The agent must accurately distinguish between legitimate correspondence and unsolicited spam or phishing attempts."

  - id: urgency_detection
    name: urgency_detection
    description: "Detect urgency level and generate response"
    grader: grade/urgency_detection.py
    difficulty: hard
    difficulty_score: 3
    max_steps: 1
    expected_score: 1.0
    criteria: "The agent must identify critical system-wide issues and generate a professional, high-priority response to the user."

action_space:
  type: object
  properties:
    category: {type: string}
    priority: {type: string}
    response: {type: string}

observation_space:
  type: object
  properties:
    email_id: {type: string}
    subject: {type: string}
    body: {type: string}

reward:
  type: float
  min: 0.0
  max: 1.0
